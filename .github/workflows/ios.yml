name: Build iOS Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa / .app)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Create .env asset file
        run: |
          cp .env.example .env

      - name: 3. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: 5. Get dependencies
        run: flutter pub get

      - name: 6. Build iOS App (Release Mode)
        run: flutter build ios --release --no-codesign

      - name: 7. Package into valid .ipa file
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r Soham.ipa Payload

      - name: 8. Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soham-iOS-IPA
          path: build/ios/iphoneos/Soham.ipa
